name: OS checks and reference
on:
  push:
    branches: [work/ugui-desktop-prototype]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project checks/Minesweeper/Minesweeper.csproj -c Release
      - run: dotnet run --project checks/Notepad/Notepad.csproj -c Release
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tools/ugui-reference.py
      - uses: actions/upload-artifact@v4
        with:
          name: current-os-reference
          path: |
            reference-desktop.png
            reference-notepad.png
          if-no-files-found: error
